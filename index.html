<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>実践訪問先</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface2: #f2f2f7;
  --surface3: #e5e5ea;
  --border: rgba(0,0,0,0.1);
  --accent: #007aff;
  --accent2: #ff3b30;
  --accent3: #34c759;
  --text: #1c1c1e;
  --text-dim: #3a3a3c;
  --text-faint: #8e8e93;
  --yellow: #ff9500;
  --card-r: 14px;
  --font: 'Noto Sans JP', sans-serif;
  --mono: 'DM Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
}

/* ── SPLASH ── */
#splashScreen {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 9999;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center; gap: 20px;
  transition: opacity 0.7s ease;
  cursor: pointer;
}
.splash-logo {
  font-size: 13px; letter-spacing: 6px; color: var(--text-dim);
  font-family: var(--mono); text-transform: uppercase;
}
.splash-title {
  font-size: 38px; font-weight: 700; letter-spacing: 2px;
  background: linear-gradient(135deg, #1c1c1e 0%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.splash-pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); margin-top: 10px;
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.8); opacity: 0.4; }
}

/* ── TOPBAR ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(242,242,247,0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-title {
  font-size: 17px; font-weight: 700; letter-spacing: 0.5px;
}
.topbar-actions { display: flex; gap: 6px; }
.icon-btn {
  min-width: 58px;
  padding: 5px 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  cursor: pointer; transition: background 0.15s;
  color: var(--text);
}
.icon-btn:active { background: var(--surface3); }
.icon-btn .ico { font-size: 18px; line-height: 1; }
.icon-btn .lbl { font-size: 9px; font-weight: 600; color: var(--text-faint); letter-spacing: 0.2px; white-space: nowrap; }

/* ── TABS ── */
.tabs {
  display: flex; gap: 4px;
  padding: 12px 16px 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.tab {
  flex: 1; padding: 10px 4px; text-align: center;
  font-size: 13px; font-weight: 600; color: var(--text-dim);
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.2s; letter-spacing: 0.3px;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── CONTENT PANES ── */
.pane { display: none; padding: 16px; }
.pane.active { display: block; }

/* ── FORM ── */
.section-label {
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  color: var(--text-faint); text-transform: uppercase;
  margin: 20px 0 10px;
}
.section-label:first-child { margin-top: 0; }

.field { margin-bottom: 10px; }
.field label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-dim); margin-bottom: 5px; letter-spacing: 0.3px;
}
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 13px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 15px;
  font-family: var(--font);
  outline: none;
  transition: border-color 0.2s;
  appearance: auto;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent);
}
.field select option { background: #222; }
.field textarea { resize: vertical; }

.row { display: flex; gap: 10px; }
.row .field { flex: 1; }

.submit-btn {
  width: 100%; padding: 14px;
  background: var(--accent);
  color: white; border: none; border-radius: 12px;
  font-size: 15px; font-weight: 700;
  cursor: pointer; margin-top: 16px;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: 0.3px;
}
.submit-btn:active { opacity: 0.8; transform: scale(0.99); }
.submit-btn.edit-mode { background: #ff9500; }
.cancel-btn {
  width: 100%; padding: 12px;
  background: var(--surface2);
  color: var(--text-dim); border: none; border-radius: 12px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; margin-top: 8px;
}

/* ── SEARCH ── */
.search-wrap {
  position: relative; margin-bottom: 14px;
}
.search-wrap input {
  width: 100%; padding: 10px 12px 10px 38px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text); font-size: 14px;
  font-family: var(--font); outline: none;
  transition: border-color 0.2s;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-icon {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint); font-size: 15px; pointer-events: none;
}

/* ── RECORD CARDS ── */
.cards-list { display: flex; flex-direction: column; gap: 10px; }

.record-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--card-r);
  overflow: hidden;
  transition: border-color 0.2s;
}
.record-card.selected { border-color: var(--accent); }

.card-top {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 14px 10px;
}
.card-checkbox { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.card-name { font-size: 17px; font-weight: 700; flex: 1; }
.visit-badge {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px; padding: 2px 8px;
  color: var(--accent);
}

.card-body { padding: 0 14px 12px; }
.card-row { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 4px; }
.card-row-label { font-size: 11px; color: var(--text-faint); width: 42px; flex-shrink: 0; padding-top: 1px; }
.card-row-val { font-size: 13px; color: var(--text-dim); flex: 1; line-height: 1.5; }
.card-row-val a { color: var(--accent); text-decoration: none; }

.dates-section { margin: 8px 0; padding: 10px; background: var(--surface2); border-radius: 10px; }
.dates-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--text-faint); text-transform: uppercase; margin-bottom: 8px; }
.date-pill-list { display: flex; flex-wrap: wrap; gap: 6px; }
.date-pill {
  display: flex; align-items: center; gap: 4px;
  background: var(--surface3); border-radius: 20px;
  padding: 4px 10px; font-size: 12px; color: var(--text);
  font-family: var(--mono);
}
.date-num { font-size: 10px; color: var(--accent); font-weight: 700; margin-right: 2px; }
.del-date {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent2); color: white; border: none;
  font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-weight: 700; line-height: 1;
}

.card-actions {
  display: flex; gap: 6px; padding: 10px 14px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.map-btn, .act-btn {
  flex: 1; min-width: 0;
  padding: 9px 4px; border-radius: 8px; border: none;
  font-size: 11px; font-weight: 700; cursor: pointer;
  text-align: center; text-decoration: none;
  display: flex; align-items: center; justify-content: center;
  line-height: 1.3; transition: opacity 0.15s;
  color: white;
}
.map-btn:active, .act-btn:active { opacity: 0.7; }
.btn-apple { background: #1c1c1e; border: 1px solid #444; }
.btn-google { background: #4285F4; }
.btn-yahoo { background: #e03030; }
.btn-adddate { background: var(--yellow); color: #222; }
.btn-edit { background: var(--surface3); border: 1px solid var(--border); color: var(--text); }
.btn-delete-card {
  width: 100%; padding: 9px;
  margin: 0 14px 12px; width: calc(100% - 28px);
  background: rgba(255,59,48,0.12); border: 1px solid rgba(255,59,48,0.3);
  color: #ff3b30; border-radius: 8px; font-size: 12px; font-weight: 700;
  cursor: pointer;
}
.btn-delete-card:active { background: rgba(255,59,48,0.25); }

/* ── MULTI-MAP BAR ── */
.multi-bar {
  display: none;
  position: fixed; bottom: 16px; left: 16px; right: 16px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px;
  gap: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.multi-bar.visible { display: flex; }
.multi-bar-label { font-size: 11px; color: var(--text-dim); font-weight: 600; padding: 0 4px; display: flex; align-items: center; }
.multi-bar-btn {
  flex: 1; padding: 10px 4px; border-radius: 8px; border: none;
  font-size: 12px; font-weight: 700; cursor: pointer; color: white;
}

/* ── MAP VIEW ── */
#mapPane { padding: 0; }
.map-toolbar {
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.map-toolbar span { font-size: 13px; color: var(--text-dim); }

#mapFrame {
  width: 100%;
  height: calc(100vh - 110px);
  border: none;
}

.map-card-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.map-list-item {
  display: flex; gap: 12px; align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 12px;
  cursor: pointer; transition: border-color 0.2s;
}
.map-list-item:hover { border-color: var(--accent); }
.map-pin { font-size: 22px; }
.map-item-info { flex: 1; }
.map-item-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.map-item-addr { font-size: 12px; color: var(--text-dim); }
.map-item-visits { font-family: var(--mono); font-size: 11px; color: var(--accent); }
.map-open-btn {
  padding: 7px 12px; background: var(--accent);
  border: none; border-radius: 8px;
  color: white; font-size: 12px; font-weight: 700; cursor: pointer;
}

/* ── STATS PANE ── */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
  text-align: center;
}
.stat-num {
  font-size: 32px; font-weight: 700; font-family: var(--mono);
  color: var(--accent); line-height: 1;
}
.stat-label { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

.ranking-list { display: flex; flex-direction: column; gap: 6px; }
.rank-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
}
.rank-num { font-family: var(--mono); font-size: 13px; color: var(--text-faint); width: 20px; }
.rank-name { flex: 1; font-size: 14px; font-weight: 600; }
.rank-bar-wrap { width: 80px; height: 6px; background: var(--surface3); border-radius: 3px; overflow: hidden; }
.rank-bar { height: 100%; background: var(--accent); border-radius: 3px; }
.rank-count { font-family: var(--mono); font-size: 12px; color: var(--accent); width: 32px; text-align: right; }

/* ── MODALS ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 500; justify-content: center; align-items: flex-end;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: #ffffff;
  border-radius: 20px 20px 0 0;
  padding: 20px 16px 36px;
  width: 100%; max-width: 500px;
  max-height: 90vh; overflow-y: auto;
  border-top: 1px solid var(--border);
}
.modal-handle {
  width: 36px; height: 4px; background: var(--surface3);
  border-radius: 2px; margin: 0 auto 16px;
}
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }

/* ── TABLE MODAL ── */
#tableModal .modal-sheet { border-radius: 16px; margin: 20px; max-height: 85vh; }
.record-table {
  width: 100%; border-collapse: collapse; font-size: 11px;
}
.record-table th, .record-table td {
  border: 1px solid var(--border); padding: 6px 5px;
  text-align: left; vertical-align: top;
}
.record-table th {
  background: var(--surface2); font-size: 10px;
  color: var(--text-dim); white-space: nowrap;
}
#tableModal .modal-overlay { align-items: center; }

/* ── MISC ── */
.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--text-faint);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 14px; }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splashScreen" onclick="startApp()">
  <p class="splash-logo">Field Visit Manager</p>
  <h1 class="splash-title">実践訪問先</h1>
  <div class="splash-pulse"></div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-title">実践訪問先</div>
  <div class="topbar-actions">
    <div class="icon-btn" onclick="openTableModal()">
      <span class="ico">🖼️</span><span class="lbl">画像保存</span>
    </div>
    <div class="icon-btn" onclick="exportData()">
      <span class="ico">⬇️</span><span class="lbl">データ保存</span>
    </div>
    <div class="icon-btn" onclick="document.getElementById('importFile').click()">
      <span class="ico">🔄</span><span class="lbl">復元</span>
    </div>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('list')">📋 記録一覧</div>
  <div class="tab" onclick="switchTab('map')">🗺 地図</div>
  <div class="tab" onclick="switchTab('stats')">📊 統計</div>
  <div class="tab" onclick="switchTab('form')">＋ 登録</div>
</div>

<!-- LIST PANE -->
<div class="pane active" id="listPane">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="名前・住所・備考で検索…" oninput="loadRecords()">
  </div>
  <div class="cards-list" id="recordsList"></div>
</div>

<!-- MAP PANE -->
<div class="pane" id="mapPane">
  <div class="map-card-list" id="mapCardList"></div>
</div>

<!-- STATS PANE -->
<div class="pane" id="statsPane">
  <div class="stats-grid" id="statsGrid"></div>
  <p class="section-label">訪問回数ランキング</p>
  <div class="ranking-list" id="rankingList"></div>
</div>

<!-- FORM PANE -->
<div class="pane" id="formPane">
  <input type="hidden" id="editId">

  <p class="section-label">基本情報</p>
  <div id="dateInputGroup" class="field">
    <label>初回訪問日</label>
    <input type="date" id="visitDate">
  </div>
  <div class="field">
    <label>訪問先の名前 *</label>
    <input type="text" id="name" placeholder="例: 山田 太郎">
  </div>
  <div class="row">
    <div class="field">
      <label>年齢</label>
      <input type="number" id="age" placeholder="30">
    </div>
    <div class="field">
      <label>性別</label>
      <select id="gender">
        <option value="未確認">選択</option>
        <option value="男性">男性</option>
        <option value="女性">女性</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>国籍 / 出身</label>
      <input type="text" id="nationality" placeholder="日本">
    </div>
    <div class="field">
      <label>職業</label>
      <input type="text" id="occupation" placeholder="会社員">
    </div>
  </div>

  <p class="section-label">連絡先</p>
  <div class="field">
    <label>電話番号</label>
    <input type="tel" id="phone" placeholder="090-1234-5678">
  </div>
  <div class="field">
    <label>住所 *</label>
    <input type="text" id="address" placeholder="例: 京都市伏見区…">
  </div>

  <p class="section-label">その他</p>
  <div class="field">
    <label>備考欄</label>
    <textarea id="remarks" rows="3" placeholder="メモや特記事項など"></textarea>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="saveRecord()">登録する</button>
  <button class="cancel-btn" id="cancelBtn" onclick="cancelEdit()" style="display:none">キャンセル</button>
</div>

<!-- MULTI-MAP BAR -->
<div class="multi-bar" id="multiBar">
  <span class="multi-bar-label" id="multiBarLabel">2件選択中</span>
  <button class="multi-bar-btn btn-apple" onclick="openMultipleOnMap('apple')">🍎 純正</button>
  <button class="multi-bar-btn btn-google" onclick="openMultipleOnMap('google')">Google</button>
  <button class="multi-bar-btn btn-yahoo" onclick="openMultipleOnMap('yahoo')">Y! Yahoo</button>
</div>

<!-- ADD DATE MODAL -->
<div class="modal-overlay" id="dateModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <p class="modal-title">訪問日を追加</p>
    <p id="targetNameForDate" style="font-size:14px; color:var(--text-dim); margin-bottom:14px;"></p>
    <div class="field">
      <label>訪問日</label>
      <input type="date" id="newVisitDateInput">
    </div>
    <input type="hidden" id="targetIdForDate">
    <button class="submit-btn" style="background:var(--accent3); color:#111;" onclick="confirmAddDate()">追加する</button>
    <button class="cancel-btn" onclick="closeDateModal()">キャンセル</button>
  </div>
</div>

<!-- TABLE MODAL -->
<div class="modal-overlay" id="tableModal" style="align-items:center;">
  <div class="modal-sheet" style="border-radius:16px; margin:16px; max-height:85vh;">
    <p class="modal-title">訪問記録一覧表</p>
    <div id="captureArea" style="background:white; padding:6px; border-radius:8px; overflow-x:auto;"></div>
    <button class="submit-btn" id="saveImgBtn" style="background:#ff9500; margin-top:12px;" onclick="saveAsImage()">📸 画像に変換して保存</button>
    <button class="cancel-btn" onclick="closeTableModal()">閉じる</button>
  </div>
</div>

<script>
// ── AUDIO ──
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, type, dur, t = 0) {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime + t);
  gain.gain.setValueAtTime(0.08, audioCtx.currentTime + t);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + dur);
  osc.stop(audioCtx.currentTime + t + dur);
}
const click = () => playTone(880, 'square', 0.08);
const chime = () => { playTone(523, 'square', 0.1, 0); playTone(659, 'square', 0.1, 0.12); playTone(880, 'square', 0.25, 0.24); };
const sad = () => { playTone(200, 'sawtooth', 0.15, 0); playTone(150, 'sawtooth', 0.3, 0.15); };
const save = () => { playTone(440, 'square', 0.1, 0); playTone(554, 'square', 0.1, 0.1); playTone(880, 'square', 0.2, 0.2); };

function startApp() {
  initAudio(); chime();
  const s = document.getElementById('splashScreen');
  s.style.opacity = '0';
  setTimeout(() => s.style.display = 'none', 700);
}

// ── TABS ──
let currentTab = 'list';
function switchTab(tab) {
  click();
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    const names = ['list','map','stats','form'];
    t.classList.toggle('active', names[i] === tab);
  });
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.getElementById(tab + 'Pane').classList.add('active');
  if (tab === 'list') loadRecords();
  if (tab === 'map') loadMapView();
  if (tab === 'stats') loadStats();
}

// ── DATA ──
function getRecords() {
  let r = JSON.parse(localStorage.getItem('visitRecords')) || [];
  return r.map(rec => {
    if (!rec.id) rec.id = Date.now() + Math.random().toString(36).substr(2, 9);
    if (!rec.dates) rec.dates = [rec.date];
    return rec;
  });
}

// ── LIST ──
function loadRecords() {
  const records = getRecords();
  const query = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const el = document.getElementById('recordsList');
  el.innerHTML = '';

  let filtered = records;
  if (query) {
    filtered = records.filter(r =>
      (r.name||'').toLowerCase().includes(query) ||
      (r.address||'').toLowerCase().includes(query) ||
      (r.remarks||'').toLowerCase().includes(query) ||
      (r.phone||'').includes(query)
    );
  }

  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">${query ? '検索結果なし' : 'まだ記録がありません'}</div></div>`;
    return;
  }

  filtered.slice().reverse().forEach(record => {
    const encAddr = encodeURIComponent(record.address);
    const appleUrl = `maps://?q=${encAddr}`;
    const googleUrl = `comgooglemaps://?q=${encAddr}`;
    const safeAddr = record.address.replace(/'/g, "\\'");
    const safeName = record.name.replace(/'/g, "\\'");

    const datesHtml = record.dates.map((d, i) => `
      <span class="date-pill">
        <span class="date-num">${i+1}回</span>${d}
        <button class="del-date" onclick="deleteSingleDate('${record.id}', ${i})">×</button>
      </span>`).join('');

    const card = document.createElement('div');
    card.className = 'record-card';
    card.id = 'card-' + record.id;
    card.innerHTML = `
      <div class="card-top">
        <input type="checkbox" class="card-checkbox select-record" value="${record.id}" onchange="toggleMultiBar(); click();">
        <div class="card-name">${record.name}</div>
        <span class="visit-badge">${record.dates.length}回</span>
      </div>
      <div class="card-body">
        <div class="card-row">
          <span class="card-row-label">電話</span>
          <span class="card-row-val"><a href="tel:${record.phone||''}">${record.phone||'未登録'}</a></span>
        </div>
        <div class="card-row">
          <span class="card-row-label">属性</span>
          <span class="card-row-val">${record.age||'?'}歳 / ${record.gender} / ${record.nationality||'?'} / ${record.occupation||'?'}</span>
        </div>
        <div class="card-row">
          <span class="card-row-label">住所</span>
          <span class="card-row-val">${record.address}</span>
        </div>
        ${record.remarks ? `<div class="card-row"><span class="card-row-label">備考</span><span class="card-row-val" style="color:var(--text-faint);">${record.remarks}</span></div>` : ''}
        <div class="dates-section">
          <div class="dates-title">訪問履歴</div>
          <div class="date-pill-list">${datesHtml}</div>
        </div>
      </div>
      <div class="card-actions">
        <a href="${appleUrl}" class="map-btn btn-apple" onclick="click()">🍎<br>純正</a>
        <a href="${googleUrl}" class="map-btn btn-google" onclick="click()">🗺<br>Google</a>
        <a href="javascript:void(0);" class="map-btn btn-yahoo" onclick="clickYahooMap('${safeAddr}','${safeName}')">Y!<br>Yahoo</a>
        <button class="act-btn btn-adddate" onclick="openDateModal('${record.id}','${safeName}')">＋<br>訪問日</button>
        <button class="act-btn btn-edit" onclick="editRecord('${record.id}')">編集</button>
      </div>
      <button class="btn-delete-card" onclick="deleteRecord('${record.id}')">この名簿を削除</button>
    `;
    el.appendChild(card);
  });
  toggleMultiBar();
}

// ── MAP VIEW ──
function loadMapView() {
  const records = getRecords();
  const el = document.getElementById('mapCardList');
  el.innerHTML = '';

  if (records.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🗺</div><div class="empty-text">訪問先を登録すると地図で確認できます</div></div>`;
    return;
  }

  // Build OpenStreetMap with markers
  const mapSection = document.createElement('div');
  mapSection.style.cssText = 'position:relative; margin: 0; background: var(--surface2);';

  // Create a simple map link area
  const allAddresses = records.map(r => r.address);
  const firstAddr = encodeURIComponent(records[0].address);

  // Map iframe via OpenStreetMap (no API key needed)
  const mapDiv = document.createElement('div');
  mapDiv.style.cssText = 'width:100%; background:var(--surface2); border-bottom: 1px solid var(--border); overflow:hidden;';

  // Try to create embedded map - use first record as center
  const osmQuery = encodeURIComponent(records[0].address);
  mapDiv.innerHTML = `
    <div style="padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border);">
      <span style="font-size:13px; color:var(--text-dim);">全${records.length}件の訪問先</span>
      <a href="https://www.google.com/maps/search/${encodeURIComponent(allAddresses.join(' '))}/" 
         style="font-size:12px; color:var(--accent); text-decoration:none; font-weight:600;" target="_blank">
        Google Mapsで全件表示 →
      </a>
    </div>
  `;

  el.appendChild(mapDiv);

  // List of places with map open buttons
  records.slice().reverse().forEach((record, i) => {
    const encAddr = encodeURIComponent(record.address);
    const item = document.createElement('div');
    item.className = 'map-list-item';
    item.innerHTML = `
      <div class="map-pin">📍</div>
      <div class="map-item-info">
        <div class="map-item-name">${record.name}</div>
        <div class="map-item-addr">${record.address}</div>
        <div class="map-item-visits" style="margin-top:3px;">${record.dates.length}回訪問 / 最終: ${record.dates[record.dates.length-1]}</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:5px; flex-shrink:0;">
        <button class="map-open-btn" onclick="openMapForRecord('${record.id}','apple')" style="background:#1c1c1e; border:1px solid #444;">🍎</button>
        <button class="map-open-btn" onclick="openMapForRecord('${record.id}','google')">🗺</button>
      </div>
    `;
    el.appendChild(item);
  });
}

function openMapForRecord(id, type) {
  click();
  const records = getRecords();
  const r = records.find(rec => rec.id === id);
  if (!r) return;
  const enc = encodeURIComponent(r.address);
  if (type === 'apple') window.open(`maps://?q=${enc}`);
  else if (type === 'google') window.open(`comgooglemaps://?q=${enc}`);
}

// ── STATS ──
function loadStats() {
  const records = getRecords();
  const total = records.length;
  const totalVisits = records.reduce((s, r) => s + r.dates.length, 0);
  const maxVisits = records.length > 0 ? Math.max(...records.map(r => r.dates.length)) : 0;
  const avgVisits = total > 0 ? (totalVisits / total).toFixed(1) : 0;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">登録件数</div></div>
    <div class="stat-card"><div class="stat-num">${totalVisits}</div><div class="stat-label">総訪問回数</div></div>
    <div class="stat-card"><div class="stat-num">${avgVisits}</div><div class="stat-label">平均訪問回数</div></div>
    <div class="stat-card"><div class="stat-num">${maxVisits}</div><div class="stat-label">最多訪問回数</div></div>
  `;

  const sorted = [...records].sort((a, b) => b.dates.length - a.dates.length).slice(0, 10);
  const rankEl = document.getElementById('rankingList');
  if (sorted.length === 0) {
    rankEl.innerHTML = '<p style="color:var(--text-faint); font-size:13px; padding:10px 0;">データなし</p>';
    return;
  }
  rankEl.innerHTML = sorted.map((r, i) => {
    const pct = maxVisits > 0 ? (r.dates.length / maxVisits * 100) : 0;
    return `
      <div class="rank-item">
        <span class="rank-num">${i + 1}</span>
        <span class="rank-name">${r.name}</span>
        <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%"></div></div>
        <span class="rank-count">${r.dates.length}回</span>
      </div>`;
  }).join('');
}

// ── YAHOO MAP ──
function clickYahooMap(address, name) {
  click();
  const cleanAddr = address.split(/[\s　]/)[0];
  fetch(`https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(cleanAddr)}`)
    .then(r => r.json())
    .then(data => {
      if (data && data.length > 0 && data[0].geometry) {
        const lon = data[0].geometry.coordinates[0];
        const lat = data[0].geometry.coordinates[1];
        window.location.href = `yjmap://pin/?lat=${lat}&lon=${lon}&name=${encodeURIComponent(name||address)}`;
      } else {
        window.location.href = `yjmap://search?q=${encodeURIComponent(address)}`;
      }
    })
    .catch(() => { window.location.href = `yjmap://search?q=${encodeURIComponent(address)}`; });
}

// ── SAVE / EDIT ──
function saveRecord() {
  const editId = document.getElementById('editId').value;
  const date = document.getElementById('visitDate').value;
  const name = document.getElementById('name').value.trim();
  const age = document.getElementById('age').value;
  const gender = document.getElementById('gender').value;
  const nationality = document.getElementById('nationality').value.trim();
  const occupation = document.getElementById('occupation').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const address = document.getElementById('address').value.trim();
  const remarks = document.getElementById('remarks').value.trim();

  if (!name || !address) { alert('名前と住所は必須です。'); return; }

  let records = getRecords();
  if (editId) {
    const idx = records.findIndex(r => r.id === editId);
    if (idx !== -1) {
      Object.assign(records[idx], { name, age, gender, nationality, occupation, phone, address, remarks });
    }
  } else {
    records.push({ id: Date.now().toString(), dates: [date], name, age, gender, nationality, occupation, phone, address, remarks });
  }
  localStorage.setItem('visitRecords', JSON.stringify(records));
  resetForm(); chime();
  switchTab('list');
}

function editRecord(id) {
  click();
  const r = getRecords().find(rec => rec.id === id);
  if (!r) return;
  document.getElementById('editId').value = r.id;
  document.getElementById('name').value = r.name;
  document.getElementById('age').value = r.age;
  document.getElementById('gender').value = r.gender;
  document.getElementById('nationality').value = r.nationality || '';
  document.getElementById('occupation').value = r.occupation || '';
  document.getElementById('phone').value = r.phone || '';
  document.getElementById('address').value = r.address;
  document.getElementById('remarks').value = r.remarks || '';
  document.getElementById('dateInputGroup').style.display = 'none';
  document.getElementById('submitBtn').textContent = '更新する';
  document.getElementById('submitBtn').classList.add('edit-mode');
  document.getElementById('cancelBtn').style.display = 'block';
  switchTab('form');
}

function resetForm() {
  document.getElementById('editId').value = '';
  document.getElementById('name').value = '';
  document.getElementById('age').value = '';
  document.getElementById('gender').value = '未確認';
  document.getElementById('nationality').value = '';
  document.getElementById('occupation').value = '';
  document.getElementById('phone').value = '';
  document.getElementById('address').value = '';
  document.getElementById('remarks').value = '';
  document.getElementById('visitDate').valueAsDate = new Date();
  document.getElementById('dateInputGroup').style.display = 'block';
  document.getElementById('submitBtn').textContent = '登録する';
  document.getElementById('submitBtn').classList.remove('edit-mode');
  document.getElementById('cancelBtn').style.display = 'none';
}

function cancelEdit() { click(); resetForm(); switchTab('list'); }

function deleteRecord(id) {
  if (!confirm('この名簿を完全に削除しますか？')) return;
  let records = getRecords().filter(r => r.id !== id);
  localStorage.setItem('visitRecords', JSON.stringify(records));
  loadRecords(); sad();
}

function deleteSingleDate(recordId, dateIndex) {
  if (!confirm('この訪問日を削除しますか？')) return;
  let records = getRecords();
  const idx = records.findIndex(r => r.id === recordId);
  if (idx !== -1) {
    records[idx].dates.splice(dateIndex, 1);
    localStorage.setItem('visitRecords', JSON.stringify(records));
    loadRecords(); sad();
  }
}

// ── DATE MODAL ──
function openDateModal(id, name) {
  click();
  document.getElementById('targetIdForDate').value = id;
  document.getElementById('targetNameForDate').textContent = name + ' さんの訪問日';
  document.getElementById('newVisitDateInput').valueAsDate = new Date();
  document.getElementById('dateModal').classList.add('open');
}
function closeDateModal() { click(); document.getElementById('dateModal').classList.remove('open'); }
function confirmAddDate() {
  const id = document.getElementById('targetIdForDate').value;
  const newDate = document.getElementById('newVisitDateInput').value;
  if (!newDate) return;
  const records = getRecords();
  const idx = records.findIndex(r => r.id === id);
  if (idx !== -1) {
    records[idx].dates.push(newDate);
    localStorage.setItem('visitRecords', JSON.stringify(records));
    loadRecords(); chime(); closeDateModal();
  }
}

// ── MULTI MAP ──
function toggleMultiBar() {
  const checked = document.querySelectorAll('.select-record:checked');
  const bar = document.getElementById('multiBar');
  const label = document.getElementById('multiBarLabel');
  if (checked.length > 0) {
    bar.classList.add('visible');
    label.textContent = `${checked.length}件選択中`;
  } else {
    bar.classList.remove('visible');
  }
}

function openMultipleOnMap(type) {
  click();
  const checked = document.querySelectorAll('.select-record:checked');
  const records = getRecords();
  const sel = Array.from(checked).map(cb => records.find(r => r.id === cb.value)).filter(Boolean);

  if (sel.length === 1) {
    const enc = encodeURIComponent(sel[0].address);
    if (type === 'apple') window.open(`maps://?q=${enc}`);
    else if (type === 'google') window.open(`comgooglemaps://?q=${enc}`);
    else clickYahooMap(sel[0].address, sel[0].name);
  } else if (sel.length === 2) {
    const s = encodeURIComponent(sel[0].address), d = encodeURIComponent(sel[1].address);
    if (type === 'apple') window.open(`maps://?saddr=${s}&daddr=${d}`);
    else if (type === 'google') window.open(`comgooglemaps://?saddr=${s}&daddr=${d}`);
    else { alert('Yahoo!マップは2件以上の経路に対応していません。'); clickYahooMap(sel[1].address, sel[1].name); }
  } else {
    const s = encodeURIComponent(sel[0].address), d = encodeURIComponent(sel[sel.length-1].address);
    if (type !== 'google') alert('3件以上の経路はGoogleマップで開きます。');
    window.open(`comgooglemaps://?saddr=${s}&daddr=${d}`);
  }

  checked.forEach(cb => cb.checked = false);
  toggleMultiBar();
}

// ── BACKUP ──
function exportData() {
  save();
  const data = localStorage.getItem('visitRecords');
  if (!data) { alert('データがありません。'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = `visit_records_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
}
function importData(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) {
        localStorage.setItem('visitRecords', JSON.stringify(data));
        loadRecords(); chime(); alert('復元完了！');
      } else alert('正しいデータファイルではありません。');
    } catch { alert('読み込みに失敗しました。'); }
  };
  reader.readAsText(file);
}

// ── TABLE MODAL ──
function buildPrintHTML(records) {
  const today = new Date().toLocaleDateString('ja-JP');
  const CARD_W = 150;

  const cardsHtml = records.map(r => {
    const allDates = r.dates.map((d, idx) =>
      `<tr><td style="color:#666;padding:1px 3px;font-size:9px;">${idx+1}回</td><td style="padding:1px 3px;font-size:9px;">${d}</td></tr>`
    ).join('');
    return `<td style="width:${CARD_W}px;min-width:${CARD_W}px;vertical-align:top;padding:4px;">
      <div style="border:1px solid #bbb;border-radius:6px;padding:8px;background:#fff;height:100%;box-sizing:border-box;">
        <div style="font-size:12px;font-weight:bold;color:#000;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:5px;word-break:break-all;">${r.name}</div>
        <div style="font-size:9px;color:#0070e0;margin-bottom:3px;">☎ ${r.phone||'未登録'}</div>
        <div style="font-size:9px;color:#444;margin-bottom:2px;">${r.age||'?'}歳・${r.gender}</div>
        <div style="font-size:9px;color:#444;margin-bottom:2px;">${r.nationality||'?'}・${r.occupation||'?'}</div>
        <div style="font-size:9px;color:#333;margin-bottom:5px;word-break:break-all;line-height:1.5;">${r.address}</div>
        ${r.remarks ? `<div style="font-size:9px;color:#888;margin-bottom:5px;border-left:2px solid #ddd;padding-left:4px;word-break:break-all;">${r.remarks}</div>` : ''}
        <div style="background:#f5f5f5;border-radius:4px;padding:4px;">
          <div style="font-size:9px;font-weight:bold;color:#333;margin-bottom:2px;">訪問履歴 ${r.dates.length}回</div>
          <table style="border-collapse:collapse;width:100%;">${allDates}</table>
        </div>
      </div>
    </td>`;
  }).join('');

  return `<div id="printRoot" style="background:#e8e8ed;padding:10px;display:inline-block;">
    <div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;min-width:100%;">
      <span style="font-size:13px;font-weight:bold;color:#1c1c1e;">実践訪問先　記録一覧</span>
      <span style="font-size:10px;color:#666;">${today}　全${records.length}件</span>
    </div>
    <table style="border-collapse:collapse;table-layout:fixed;">
      <tr>${cardsHtml}</tr>
    </table>
  </div>`;
}

function openTableModal() {
  click();
  const records = getRecords();
  const captureArea = document.getElementById('captureArea');
  captureArea.style.cssText = 'overflow-x:auto;overflow-y:auto;max-height:52vh;background:white;padding:4px;border-radius:8px;';
  captureArea.innerHTML = buildPrintHTML(records);
  document.getElementById('saveImgBtn').style.display = 'block';
  document.getElementById('tableModal').classList.add('open');
}

function closeTableModal() { click(); document.getElementById('tableModal').classList.remove('open'); }

function saveAsImage() {
  save();
  const records = getRecords();

  // オフスクリーンのdivに描画してからキャプチャ（白紙対策）
  const offscreen = document.createElement('div');
  offscreen.style.cssText = 'position:fixed;left:-9999px;top:0;z-index:-1;';
  offscreen.innerHTML = buildPrintHTML(records);
  document.body.appendChild(offscreen);

  const target = offscreen.querySelector('#printRoot');

  // レンダリングが確定するまで少し待ってからキャプチャ
  requestAnimationFrame(() => {
    setTimeout(() => {
      html2canvas(target, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#e8e8ed',
        logging: false,
        width: target.scrollWidth,
        height: target.scrollHeight,
        windowWidth: target.scrollWidth + 100,
      }).then(canvas => {
        document.body.removeChild(offscreen);
        const img = canvas.toDataURL('image/jpeg', 0.95);
        const captureArea = document.getElementById('captureArea');
        captureArea.style.cssText = 'overflow-x:auto;overflow-y:auto;max-height:52vh;background:white;padding:4px;border-radius:8px;';
        captureArea.innerHTML = `
          <div style="text-align:center;margin-bottom:10px;">
            <p style="color:#ff3b30;font-weight:bold;font-size:14px;">👇 下の画像を長押しして「写真に保存」</p>
          </div>
          <img src="${img}" style="width:100%;border-radius:4px;display:block;">`;
        document.getElementById('saveImgBtn').style.display = 'none';
      });
    }, 300);
  });
}

document.getElementById('visitDate').valueAsDate = new Date();
loadRecords();
